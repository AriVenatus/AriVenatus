<title id="t">$ ls -lt ~/repos | head -5</title>
<desc id="d">ari@github:~$ ls -lt ~/repos | head -5
2026-11-25  claude-usage-limits         Claude Code plugin: Usage tab with context, cost,
                                        5h/weekly limits, pace hints and cache keep-alive
2026-09-08  token-radar                 Multi-chain Telegram token listener with a terminal
                                        UI
2026-09-07  GatekeeperV4                A Discord bot for managing CubeCoders AMP game
                                        servers — console and chat bridging, Discord Role ↔
                                        whitelist sync, self-service account linking, and
                                        live server banners.
2026-07-03  sol-wallet-analysis-tool    A Python-based tool for analyzing Solana wallet
                                        activity, focusing on trading behavior, farming
                                        patterns, and ROI calculations.
2026-07-03  sol-wallet-tx-scraper       Scrapes SOL withdrawals from known CEX wallets via
                                        Solana RPC, collecting the receiving addresses.
# updated daily by a GitHub Action</desc>
